name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  # Reality is a foundation library: a regression here reaches every
  # consumer, so coverage is gated.
  COVERAGE_THRESHOLD: 80

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      # One failing Go version must not cancel the others: each leg is
      # evidence in its own right.
      fail-fast: false
      matrix:
        # go.mod declares `go 1.24` (the minimum); also exercise the
        # supported releases.
        go-version: ['1.24', '1.25', '1.26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic -count=1 ./...

      - name: Coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Reality coverage: ${total}%"
          if [ "$(echo "${total} < ${{ env.COVERAGE_THRESHOLD }}" | bc -l)" -eq 1 ]; then
            echo "::error::Reality coverage ${total}% is below the ${COVERAGE_THRESHOLD}% threshold"
            exit 1
          fi

  # Fused multiply-add rounds once where a separate multiply and add round
  # twice, so it moves floating-point results in the last bits. The Go
  # compiler fuses on arm64 and on amd64 built with GOAMD64=v3, but not on the
  # default amd64 build the test job uses. The precision claims must hold on
  # all three. The arm64 leg reports without failing the build until it has
  # passed once.
  fma:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.target == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64 GOAMD64=v3
            runner: ubuntu-latest
            goamd64: v3
          - target: arm64
            runner: ubuntu-24.04-arm
            goamd64: ''
    env:
      GOAMD64: ${{ matrix.goamd64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Test
        run: go test -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26-

      # The linter version is pinned (and its configuration committed in
      # .golangci.yml) so a new upstream release cannot change the gate's
      # verdict without a change to this repository.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.24-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.24-

      - name: Benchmarks
        run: go test -bench=. -benchmem -benchtime=1s -run='^$' ./...

  # Security gate: gosec, govulncheck and trivy, each failing the build on a
  # finding. Tool versions are pinned (third-party actions by commit SHA).
  # This job runs on a supported Go release, because govulncheck reports
  # standard-library vulnerabilities that are only fixed in supported
  # releases.
  security:
    name: Security (gosec + govulncheck + trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26-

      # gosec fails the build on any finding. Intended sites carry a same-line
      # `#nosec <rule> -- <reason>` annotation.
      - name: Run gosec
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: './...'

      # govulncheck exits 1 on any known vulnerability reachable from the
      # module (the module has no external dependencies; this covers the
      # standard library).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck
        run: govulncheck ./...

      # trivy filesystem scan, gating on CRITICAL/HIGH.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
